name: i18n contract

# Blocks merges when REQUIRED_TRANSLATION_KEYS / REQUIRED_TIME_LINE_KEYS drift
# from the keys actually consumed by the tooltip builder.
#
# To unblock locally:
#   npm run i18n:autofix
#   git commit -am "chore(i18n): sync REQUIRED_* keys"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/lastChangeTooltipContent.ts"
      - "src/lib/lastChangeTooltipModel.ts"
      - "scripts/autofix-required-translation-keys.mjs"
      - "package.json"
      - ".github/workflows/i18n-check.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  i18n-check:
    name: REQUIRED_* keys in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify REQUIRED_* lists match builder usage
        run: npm run i18n:check
