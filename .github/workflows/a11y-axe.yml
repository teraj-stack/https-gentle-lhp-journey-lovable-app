name: a11y-axe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          echo $! > .preview.pid
          npx wait-on http://127.0.0.1:4173 -t 60000

      - name: Run axe-core suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        # Continue even on failure so the report still uploads.
        continue-on-error: true
        id: axe
        run: npm run test:a11y

      - name: Generate HTML report
        if: always()
        run: node scripts/a11y-report-html.mjs

      - name: Upload accessibility report (HTML + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop preview server
        if: always()
        run: |
          if [ -f .preview.pid ]; then kill "$(cat .preview.pid)" 2>/dev/null || true; fi

      - name: Fail job if axe suite failed
        if: steps.axe.outcome == 'failure'
        run: |
          echo "axe-core suite reported blocking violations — see the 'a11y-report' artifact." >&2
          exit 1
